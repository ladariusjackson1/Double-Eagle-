<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Double Eagle Financial — bookkeeping for real estate agents and contractors">
  <rect width="1200" height="630" fill="#10161C"/>
  <g opacity="0.5">
    <rect x="0" y="612" width="1200" height="8" fill="url(#milled)"/>
  </g>
  <defs>
    <pattern id="milled" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="8" fill="#A87F26"/>
    </pattern>
  </defs>
  <circle cx="90" cy="80" r="26" stroke="#A87F26" stroke-width="2" fill="none"/>
  <path d="M90 62 L102 80 L90 98 L78 80 Z" stroke="#A87F26" stroke-width="2" fill="none"/>
  <text x="132" y="76" font-family="Georgia, serif" font-size="26" fill="#FFFFFF">Double Eagle</text>
  <text x="132" y="98" font-family="monospace" font-size="13" letter-spacing="3" fill="#8494A1">FINANCIAL</text>
  <text x="80" y="270" font-family="Georgia, serif" font-size="66" fill="#FFFFFF">You closed the deal.</text>
  <text x="80" y="348" font-family="Georgia, serif" font-size="66" fill="#E8D3A0" font-style="italic">Did you make money?</text>
  <text x="80" y="430" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A9B6C2">Profit per deal and per job, by the 10th of every month.</text>
  <text x="80" y="472" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A9B6C2">Bookkeeping for real estate agents and contractors.</text>
  <text x="80" y="556" font-family="monospace" font-size="20" letter-spacing="2" fill="#A87F26">DOUBLEEAGLEFINANCIAL.COM</text>
